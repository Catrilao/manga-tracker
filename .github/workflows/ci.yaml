name: CI / Code Quality

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yaml"
      - ".github/workflows/sync-uv-lock.yaml"

  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRACKER_ENV: test
      DATABASE_URL: postgresql://mock:mock@localhost:5432/mock
      DISCORD_WEBHOOK: https://discord.com/api/webhooks/mock/mock

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version-file: ".python-version"

      - name: Lint
        run: |
          uv run pre-commit run --all-files

      - name: Test
        if: "!cancelled()"
        run: |
          uv run pytest -n logical
